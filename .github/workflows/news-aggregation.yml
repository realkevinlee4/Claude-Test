name: Daily News Aggregation

on:
  # Schedule for hourly updates (8 AM - 6 PM EST = 1 PM - 11 PM UTC)
  schedule:
    - cron: '0 13-23 * * *'  # Every hour from 1 PM to 11 PM UTC (8 AM - 6 PM EST)
    - cron: '0 14 * * *'      # 9 AM EST daily for overnight summary (2 PM UTC)

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run (hourly, overnight, cleanup, or start)'
        required: false
        default: 'hourly'
        type: choice
        options:
          - hourly
          - overnight
          - cleanup

# Required permissions for committing reports
permissions:
  contents: write

jobs:
  aggregate-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Create .env file
        run: |
          cat > .env << EOF
          NEWSAPI_KEY=${{ secrets.NEWSAPI_KEY }}
          PROPUBLICA_API_KEY=${{ secrets.PROPUBLICA_API_KEY }}
          TWITTER_BEARER_TOKEN=${{ secrets.TWITTER_BEARER_TOKEN }}
          REDDIT_CLIENT_ID=${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET=${{ secrets.REDDIT_CLIENT_SECRET }}
          TZ=America/New_York
          REPORTS_DIR=./reports
          DATABASE_PATH=./data/news.db
          EOF

      - name: Ensure directories exist
        run: |
          mkdir -p reports data

      - name: Determine which command to run
        id: determine_command
        run: |
          # Check if this is a manual dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "command=${{ github.event.inputs.command }}" >> $GITHUB_OUTPUT
          else
            # Check the hour (UTC) to determine if this is the overnight summary
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "14" ]; then
              echo "command=overnight" >> $GITHUB_OUTPUT
            else
              echo "command=hourly" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run news aggregation
        run: |
          npm start ${{ steps.determine_command.outputs.command }}
        env:
          TZ: America/New_York

      - name: Commit and push reports
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Add generated reports and database
          git add reports/ data/ || true

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new reports to commit"
          else
            TIMESTAMP=$(TZ=America/New_York date '+%Y-%m-%d %H:%M EST')
            git commit -m "📰 Automated news update - $TIMESTAMP"
            git push
          fi

      - name: Upload reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-reports-${{ github.run_number }}
          path: |
            reports/
            data/
          retention-days: 30

      - name: Report generation summary
        if: always()
        run: |
          echo "## 📊 News Aggregation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Command:** ${{ steps.determine_command.outputs.command }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S EST')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d "reports" ] && [ "$(ls -A reports)" ]; then
            echo "### Generated Reports:" >> $GITHUB_STEP_SUMMARY
            ls -lh reports/ | tail -5 >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No reports generated" >> $GITHUB_STEP_SUMMARY
          fi
